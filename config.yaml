  mode: all
caps:
  max_orders_per_cycle: 5
  max_orders_per_day: 20
  max_notional_per_day: 50000.0
  # POT-TIERED TAKE-PROFIT RUNNER CEILING -- REMOVED 2026-07-26.
  #
  # This block used to hold `tp_tiers`, a table keyed on account size that scaled a take-profit
  # ceiling + DEFAULT target, consumed at ENTRY by construction.tp_tier_for_pot. At the live pot
  # (~$1,893) it resolved the `< $2,500` floor row and stamped a +20% profit target onto EVERY
  # order. A position that ran +300% was sold at +20% by arithmetic, with no reference to whether
  # anything had changed.
  #
  # Trevor's ruling (dataset-v8-build-20260725/RULING_TAKE_PROFIT.md, 2026-07-26):
  #   "+20% is doctrine, not a clamp -- a potential exit when the thesis has changed AND value has
  #    been given back, never a mechanical target."
  # Implemented per Sol audit R5 section R2, which is explicit that removing this table ALONE was
  # insufficient: the global rules.profit_target_pct fallback and the mechanical +20%
  # rules.scale_out encoded the same forbidden doctrine and were removed in the same change.
  #
  # THE SUPERSEDED NOTE THAT USED TO SIT HERE: it declared the small-pot inverted reward:risk
  # (a 20-25% take-profit sitting BELOW the -30% stop) deliberate, and instructed that it must NOT
  # be "fixed" or re-checked. That instruction is VOID -- it was protecting the mechanism this
  # ruling abolishes. There is no longer a manufactured take-profit of any size to invert against.
  #
  # DO NOT RE-ADD tp_tiers, and do not reintroduce a numeric default anywhere on the entry path.
  # Account size is not an exit signal. +20% is evidence the MODEL may weigh, never a level the
  # code installs. The only numeric automatic exits that remain are the -30% maximum-loss stop
  # (unchanged, below) and an EXPLICITLY supplied 100-500% catastrophe backstop
  # (construction.optional_take_profit_pct). Profit protection on a winner now comes from the
  # confirmed trailing stop (rules.trailing, Sol audit R5 R1), which is why R2 was sequenced to
  # ship only after that trail was live and tested.
rules:
  # 2026-07-01 constructor rework (journal audit n=9): +75-100% targets were touched 0/9
  # times while +20-35% MFE was reached by 4/8 -> default TP +30% / stop -30%. Time stop
  # moved DTE 3 -> 10: both direction-RIGHT losers died of short DTE, one force-dumped at
  # DTE<=3 expired at full value 3 days later. Keep time_stop_days == construction.dte_exit_threshold.
  # GLOBAL TAKE-PROFIT FALLBACK -- DISABLED 2026-07-26 (null), Sol audit R5 R2, path 2 of 3.
  # This was 30.0 and was reached by every `je.get("profit_target_pct") or
  # config.rules.profit_target_pct` read in the manager, so removing the pot tiers alone would
  # have left a mechanical +30% full exit on every position that lacked a journalled target.
  # null = there is NO automatic profit target. A winner is governed by the model's judgment
  # (thesis changed AND value given back) plus the confirmed trailing stop; a loser is governed by
  # the -30% stop below. Setting this back to a number re-arms mechanical profit-taking across the
  # whole book in one line -- don't, without re-reading RULING_TAKE_PROFIT.md.
  profit_target_pct: null
  stop_pct: 30.0
  time_stop_days: 10
  exit_market_orders: true
  # EXIT SLIPPAGE FLOOR (2026-07-03, config-driven; tuned by tune_exit_floor.py). A TRIGGERED
  # bid-anchored SELL-to-close is never priced below mark*(1-this) -- a catastrophe guard against a
  # broken/stub bid. 0.50 == the prior hardcoded order.py EXIT_SLIPPAGE_FLOOR (byte-identical
  # default). tune_exit_floor.py PROPOSES a value from logged fill quality; apply here or via
  # `tune_exit_floor.py --write`. (SEAM: to reach a LIVE OrderManager, manager.py must also pass
  # exit_slippage_floor=cfg.rules.exit_slippage_floor -- flagged, not yet wired.)
  exit_slippage_floor: 0.50
  # MECHANICAL +20% SCALE-OUT -- DISABLED 2026-07-26 (Sol audit R5 R2, path 3 of 3).
  # This trimmed half the position the moment gain hit +20%. Sol's finding: it is the SAME
  # forbidden doctrine encoded as a partial exit -- a bare percentage banking a winner with no
  # reference to whether the thesis changed or whether anything had been given back. Killing the
  # pot tiers and the global fallback while leaving this armed would have left the ruling
  # half-implemented and a +20% trim still firing on every runner.
  # The gain-protection job it was doing now belongs to the CONFIRMED trailing stop below
  # (two consecutive qualifying closes, Sol audit R5 R1) -- which is why R2 shipped only after
  # that trail was live. A future model-SELECTED trim would need its own explicit action and
  # contract; it must not come back as a threshold here.
  scale_out:
    enabled: false            # 2026-07-26: was true. Mechanical partial take-profit, removed.
    first_target_pct: 20.0    # inert while disabled; kept so the shape of the removed rule is legible
    trim_fraction: 0.5        # inert while disabled
  trailing:
    enabled: true             # PRIOR: was false -- now ON
    # 2026-07-26 RESTORED TO 20.0 (Sol audit R5 section R1, ruling path (a)).
    # Trevor asked for arming at +15% ("make sure the trailing stop gets triggered once a position
    # gets to 15% up") but he chose that number TOGETHER WITH multi-session confirmation. The
    # confirmation mechanism did not exist yet, so 15.0 on disk was early arming WITHOUT the
    # safety that justified it.
    # MEASURED CAVEAT -- a 365-DTE 0.60-delta option has elasticity ~2.0-2.8x its underlying, so
    # its own 1-sigma DAILY move is ~10-12%. Armed at +15% with giveback 0.4 the protected floor
    # sits only 5.2% below the peak -- roughly 0.5 of a daily sigma, i.e. INSIDE one average day
    # of option noise. The raw tick-based trail at +15% fires on noise, not on a thesis change.
    # THIS RETURNS TO 15.0 IN THE SAME REVIEWED CHANGE THAT ENABLES CONFIRMATION -- i.e. only once
    # the two-consecutive-qualifying-CLOSES contract (state.record_session_close /
    # State.is_trail_armed) is live, proven, and switched on for the live book. Do not lower it
    # on its own. See RULING_TAKE_PROFIT.md + SOL_AUDIT_R5.md section R1.
    activation_gain_pct: 20.0 # RESTORED from 15.0 (was 20.0 originally)
    giveback_fraction: 0.4    # exit if runner gives back >40% of its PEAK gain-above-entry
                              #   (keeps >=60% of the realized peak gain)
  # GAIN-PROTECTING AUTO-TRAIL SAFETY FLOOR (2026-07-03 Part 2). A WIDE trailing stop that
  # AUTO-ARMS on ANY winner once its PEAK gain clears activation_gain_pct -- even if the model
  # never says arm_trail and even if `trailing.enabled` above is off. It only ADDS/WIDENS
  # downside protection (never chokes a runner, never suppresses the take-profit ceiling, never
  # touches the 30% stop) and rides the monotonic peak UP. Prevents an up-big winner round-tripping
  # to breakeven when the model returns 'hold'. ENABLED by default per the 'protect gains by
  # default' ask; set enabled:false for an exact no-op. UNVALIDATED PRIORS -- eyeball before re-arm.
  auto_trail:
    enabled: true
    activation_gain_pct: 25.0 # auto-arm a protective trail once PEAK gain >= +25% (just below the
                              #   +30% full target); guarantees the gain is protected thereafter
    giveback_fraction: 0.5    # WIDE floor: exit only if a runner gives back >50% of its PEAK
                              #   gain-above-entry (keeps >=50% of the realized peak gain)
construction:
  # 2026-07-01 trade-construction rulebook (evidence: journal audit 6/12-7/1). Tune HERE,
  # not in code -- consumed by exitmgr/construction.py via daily_recommend + exitmgr/trader.
  min_dte: 25                # DTE floor at entry; shorter model ideas get ADJUSTED up (journal-annotated)
  # 2026-07-26 (Trevor): raised 170 -> 800. construction.py:48 computes
  #   eff_target = min(max(tgt, min_dte), max(prefer_dte_max, min_dte))
  # so prefer_dte_max is a HARD CEILING on the model's requested DTE. At 170 EVERY long-dated
  # request collapsed: 365->170, 497->170, 638->170, 795->170 -- i.e. production silently deleted
  # the 365-DTE doctrine and bought ~170-DTE structures, which is precisely the ~168-DTE theta
  # bleed the v8 corpus exists to abolish, and it was journalled merely as "adjusted".
  # 800 clears the longest LEAP the constructor will ever be asked for, so the ceiling stops
  # overriding intent. NOTE: this does NOT install a 365 floor -- min_dte is still 25, so a model
  # that ASKS for a short expiry still gets one. Raising min_dte is a separate, larger decision.
  prefer_dte_max: 800        # was 170 (and 45 before 2026-07-22, which clamped 78.7% of taught legs)
  # 2026-07-26 STRUCTURE-AWARE DTE FLOOR (CREDIT_PATH_SPEC.md S3; authority SOL_AUDIT_R3.md
  # S4:117-125). min_dte above is the DEBIT floor and stays 25: the buyer PAYS theta, so a
  # short-dated long call is the -$1,521 failure mode the doctrine abolishes. A cash-secured
  # put COLLECTS theta, so it gets its OWN window below -- weeklies are the point of a write.
  # These two keys are read ONLY on the credit path (construction.dte_bounds_for_side); a debit
  # idea can never reach credit_min_dte, which is exactly why this is a split and not
  # `min_dte: 3`. Sol S4 words the write window as 7-45; the frozen spec sets the floor at 3 to
  # allow true weeklies -- raise this to 7 to run Sol's tighter window.
  credit_min_dte: 3          # cash-secured puts ONLY: weeklies allowed (NEVER applies to a debit)
  credit_max_dte: 45         # cash-secured puts ONLY: HARD upper bound (Sol S4) -- a 60-DTE
                             #   write is refused outright, not rounded to the nearest expiry
  tp_pct: 0.30               # default take-profit = +30% of debit
  tp_min_pct: 0.25           # model-provided TP clamped into [tp_min, tp_max]
  tp_max_pct: 0.35
  sl_pct: -0.30              # default stop = -30% of debit (model stops may be tighter, never looser)
  max_premium_pct: 0.25      # premium per trade <= 25% of net-liq (downsizes qty first, then rejects);
                             #   matches risk.py max_trade_pct 0.25 and the C25 sizing bands
  max_deployed_pct: 0.60     # TOTAL deployed premium <= 40% of net-liq; coupled to the
                             #   4%/day portfolio-decay cap at the hard DTE<=10 exit boundary
  max_decay_pct_per_day: 0.01            # (debit/DTE)/net-liq <= 1%/day per trade
  max_portfolio_decay_pct_per_day: 0.04  # portfolio theta-decay total <= 4%/day
  dte_exit_threshold: 10     # exit/roll evaluation at DTE<=10; green/thesis-intact -> managed LIMIT exit
  fill_alarm_minutes: 15     # unfilled-order Slack alarm threshold during RTH
  delta_min: 0.55            # long-leg target-delta band (rejects lottery far-OTM legs)
  delta_max: 0.65
  # Stage B NBBO freshness (2026-08-13). A build takes ~30s of sequential IBKR round trips; the
  # old hardcoded 10s discarded the whole candidate set and 91% of intents died as
  # "0 prefiltered candidates". Not the fill-safety gate -- reprice_binding re-quotes and
  # re-validates the selected contract at submission.
  stage_b_quote_max_age_s: 45.0
  # REQUIRED, percent units: ((ask-bid)/midpoint)*100. 25.0 matches the existing
  # decision-card liquidity gate maximum_relative_spread of 0.25.
  max_entry_spread_pct: 25.0
  # TWO-LEG combos cross BOTH legs' spreads, so the same liquidity reads ~2x wider than a single
  # leg. The single-leg 25% discarded every candidate on the live ORCL chain (a $280 spread showed
  # 38.3%). 45% is that same standard rescaled for a two-leg quote (2026-08-13).
  max_combo_spread_pct: 45.0
  spread_width_max_pct: 0.08 # no-IV fallback: spread width <= 8% of spot
  strike_near_spot_pct: 0.03 # no-IV fallback: long strike within 3% of spot
  # EARNINGS BLACKOUT (2026-07-03 gate A5): a DEBIT held through an earnings print is an
  # IV-crush loser by construction -- IV collapses post-print and the long premium bleeds
  # even when direction is right. Block entering a debit whose holding horizon straddles a
  # KNOWN next-earnings date (source: research.days_to_earnings via yfinance). FAIL-OPEN on
  # unknown earnings (never hard-blocks; the slate flags it 'unchecked').
  earnings_blackout_enabled: true  # block if a known earnings date <= expiry (+cushion)
  earnings_blackout_days: 0        # extra cushion days beyond expiry also treated as blackout
  # EARLY-ASSIGNMENT / EX-DIVIDEND RISK (2026-07-03 gate A6): a DEBIT SPREAD whose ITM short leg
  # (classically a short CALL) heads into an ex-dividend date can be assigned EARLY -- a
  # counterparty exercises the ITM short to capture the dividend, forfeiting the dividend to you
  # and converting the spread. Source: research.days_to_ex_dividend via yfinance calendar.
  # DISPOSITION = WARN by default (early assignment is manageable, not a guaranteed loss): the
  # slate SURFACES a :warning: note but still lets the trade through. FAIL-OPEN on unknown ex-div
  # (never hard-blocks; flagged 'unchecked'). Flip assignment_block_hard to hard-reject instead.
  assignment_check_enabled: true   # surface ex-div early-assignment risk on ITM-short spreads
  assignment_block_hard: false     # false => WARN only (default); true => hard-reject
  assignment_cushion_days: 0       # extra cushion days beyond expiry also treated as at-risk
trading:
  # AUTO-APPROVE (2026-08-14). Four correctly-sized trades cleared every risk gate today and
  # THREE expired unclicked in Slack (approved:true, reasons:[], $210-$223 against a $1,184
  # per-trade cap). The gates are what encode the risk policy; the Slack tap was adding
  # latency, not safety. Submission still rebuilds from a fresh account/chain/NBBO and
  # re-runs every hard gate, so this removes the human tap and no risk check.
  auto_approve_within_gates: true

  slack_channel: C0XXXXXXXXX
  summary_channel: C0XXXXXXXXX
  alerts_channel: C0XXXXXXXXX
  error_channel: C0XXXXXXXXX   # #error-logs -- unfilled-order fill alarms (2026-07-01)
  approver_ids:
  - U0XXXXXXXXX
  llm_endpoint: http://localhost:8888/v1/chat/completions
  llm_model: /path/to/model
  manage_positions: true
  # 2026-07-26: added the affordability-screened universe. At a ~$1,893 account with a 25%%
  # per-trade cap and a 365-DTE floor, a 1-year 0.60-delta call must cost <= ~$473, i.e.
  # 0.40*spot*vol*100 <= cap. That admits cheap names (incl. high-vol ones) and excludes
  # expensive or high-notional ones. Recompute the set when net-liq changes -- the ceiling
  # is a function of account size, not a fixed price.
  # 2026-07-26: +8 ADDITIONS, ZERO REMOVALS. Trevor keeps every high-volatility name.
  # These were selected on spot x vol, not share price -- a 365-DTE 0.60-delta call costs about
  # 0.40*spot*vol*sqrt(T)*100, so what makes a name affordable is LOW VOLATILITY, not a low
  # quote. Measured 365-DTE 0.60-delta debits vs the $473.25 per-trade cap at $1,893 net liq:
  #   GRAB $47 (36% vol) · SNAP $108 (62%) · NWL $120 (59%) · CHPT $162 (79%)
  #   KVUE $167 (22%)    · HBAN $194 (28%) · KEY  $222 (24%)
  # All clear the tighter $250 corpus rule too. They add consumer-defensive, financials and
  # communication-services exposure to a list that was concentrated in speculative tech/energy.
  # NOT added: ASTS. At $56.20 with 116% realized vol its 365-DTE 0.60-delta debit is ~$2,599 --
  # 5.5x the per-trade cap. Under $60 a share, unaffordable as an option. Revisit near ~$12k net liq.
  # PFE added 2026-07-26 by Trevor's ruling, with the sector ban removed in the same change:
  # $214 debit, 22% vol, and ZERO -10% sessions in the entire price cache (worst day -7.7%) --
  # the same risk class as KMI and T, not MRNA.
  approved_names: [SPY, QQQ, IWM, AAPL, MSFT, NVDA]  # placeholder -- real ~400-name universe scrubbed (strategy)
  allow_model_names: true
  # ApeWisdom supplies an ephemeral source of candidate TICKERS for the morning slate.
  # Attention metrics are shown only in the separate discovery post; the trade strategist
  # receives independent quote/technical/news research and no popularity signal.
  apewisdom_discovery:
    enabled: true
    filter: all-stocks
    source_limit: 20
    probe_limit: 12
    research_limit: 8
  blocked_names:
  - EXAMPLE_TICKER   # placeholder -- original block-list scrubbed
  # 2026-07-26 (Trevor): sector ban REMOVED. It blocked the safer half of healthcare while the
  # approved list already carried far riskier names -- measured, large-cap pharma averages 0.1
  # down-10% sessions/yr (PFE: ZERO in the whole cache, worst day -7.7%) against 5.7/yr for the
  # names already approved. The hazard being guarded is a scheduled binary event gapping through
  # a stop, which is now stated as a sizing/timing rule in strategist._UNIVERSE rather than as a
  # sector exclusion. Left EMPTY, not deleted: profile_eligible() still enforces it, so a future
  # sector can be blocked by adding one line here without touching code.
  blocked_sector_keywords: []
  # CORRELATION / SECTOR CONCENTRATION CAP (2026-07-03). Caps aggregate premium-at-risk across a
  # CORRELATED cluster so three separate semis (NVDA+AMD+MU) can't sail through the single-name-agg
  # cap as three names while being one macro bet. max_sector_agg_pct = fraction-of-pot ceiling on
  # any one cluster's summed non-index premium. Set BELOW max_single_name_agg (0.36) so it actually
  # binds (>=0.36 would be dead, since the whole non-index book is already 0.36-capped); ~2x the
  # 0.12 soft per-trade cap lets ~two soft-sized correlated names coexist but blocks a third
  # concentrating the same bet. Only binds in non-`confident` mode, like the single-name-agg cap.
  max_sector_agg_pct: 0.40
  # sector_map: STATIC, hand-editable symbol -> cluster id. The pragmatic no-network source of truth
  # (a live correlation/beta feed is a future upgrade). Unmapped symbols cluster only with THEIR OWN
  # name (no clustering => behaves as before). Empty map => the sector cap is a full no-op. Edit
  # freely -- add symbols/clusters as the book concentrates. Starter clusters below; extend as needed.
  sector_map:
    # --- semiconductors (the flagship correlated cluster) ---
    NVDA: semis
    AMD: semis
    MU: semis
    AVGO: semis
    MRVL: semis
    QCOM: semis
    TXN: semis
    ADI: semis
    LRCX: semis
    AMAT: semis
    KLAC: semis
    ASML: semis
    INTC: semis
    ARM: semis
    SMCI: semis
    STX: semis
    WDC: semis
    SNDK: semis
    DRAM: semis
    MRAM: semis
    POET: semis
    SOXX: semis
    SMH: semis
    SOXL: semis
    # --- megacap tech (highly co-moving, QQQ-correlated) ---
    AAPL: megacap_tech
    MSFT: megacap_tech
    GOOGL: megacap_tech
    AMZN: megacap_tech
    META: megacap_tech
    NFLX: megacap_tech
    # --- crypto / bitcoin proxies + miners ---
    COIN: crypto
    MARA: crypto
    RIOT: crypto
    CIFR: crypto
    IREN: crypto
    IBIT: crypto
    ARKB: crypto
    # --- AI power / datacenter buildout ---
    VRT: ai_power
    OKLO: ai_power
    BE: ai_power
    NBIS: ai_power
    CRWV: ai_power
  pot_cap_usd: null
  confident_full_size: false
  confident_conviction: 7        # legacy key (back-compat); superseded by cap_bypass_min_conviction
  cap_bypass_min_conviction: 7   # conviction >= this may exceed the soft base cap toward the hard
                                 # ceiling (kept at the live 7; raise/lower here, not in code)
  cash_buffer_pct: 0.05          # ALWAYS keep 5% of NetLiq (account value) liquid -- clamps the
                                 # final $ size to available_funds - 5%*NetLiq on every path
  # PENDING CONVICTION CALIBRATION -- do not steepen until journal calibration justifies it.
  # conviction (1-10) -> fraction-of-pot. Shipped FLAT at the live base cap (0.25) so installing the
  # curve mechanism does NOT change sizing vs today; edit these numbers once calibrated.
  conviction_size_curve:
    1: 0.25
    2: 0.25
    3: 0.25
    4: 0.25
    5: 0.25
    6: 0.25
    7: 0.25
    8: 0.25
    9: 0.25
    10: 0.25
  # EMPIRICAL CONVICTION SIZE MULTIPLIERS (PROPOSE-ONLY; default EMPTY/absent => 1.0 => flat sizing
  # UNCHANGED). Fit from REAL closed-trade outcomes by calibrate_conviction_sizing.py and GATED via
  # gordon-gauntlet/calibration_gate.py (min-sample + discrimination) so thin data can NEVER up-size.
  # conviction(1-10) -> multiplier on the per-trade SOFT size: >1 up-sizes a genuinely-outperforming
  # bucket (bounded so it never exceeds the hard ceiling), <1 down-sizes an underperformer, 1.0 flat.
  # Left EMPTY until Trevor reviews a proposal AND opts in -- to size real money you ALSO must wire it
  # into run_trader.py's RiskLimits (mirror conviction_size_curve). Empty/absent => full no-op.
  # conviction_size_multipliers: {}
  max_trade_pct: 0.25
  add_suggest_min_conviction: 7
  entry_limit_buffer_pct: 0.05
  max_concurrent: 8
  daily_halt_pct: 0.2
  baseline_path: ./day_baseline.json
  audit_path: ./audit.jsonl
